# On every push: builds the finished Linux game with ./release.sh and checks that
# every puzzle page is solvable. The game is attached to each run as "kolam-linux".
name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - name: Install the X11 headers raylib needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev libxfixes-dev

      - name: Build the game
        run: ./release.sh linux

      - name: Check the puzzle pages
        run: build/release/kolam-linux-x86_64 --check-pages

      - uses: actions/upload-artifact@v4
        with:
          name: kolam-linux
          path: build/release/kolam-linux-x86_64
